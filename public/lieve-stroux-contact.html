  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #141014;
      color: #f5e9e5;
      font: 16px/1.6 system-ui, sans-serif;
      text-align: center;
    }
    a { color: inherit; text-underline-offset: .35em; }
    a:hover { color: #e8aeba; }
    a:focus-visible { outline: 2px solid #e8aeba; outline-offset: 5px; }
    header, main, footer { padding-inline: 20px; }
    header { overflow: hidden; padding-block: clamp(50px, 9vw, 110px) 40px; }
    h1, blockquote {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
    }
    h1 {
      margin: 0 0 26px;
      font-family: "Great Vibes", "Apple Chancery", "URW Chancery L", cursive;
      font-size: clamp(40px, 11vw, 145px);
      line-height: 1.25;
      white-space: nowrap;
    }
    h2, nav {
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    h2 { margin: 0 0 18px; }
    .release { padding-bottom: 62px; }
    .artwork {
      display: grid;
      place-items: center;
      width: min(100%, 370px);
      aspect-ratio: 1;
      margin: 24px auto;
      background: radial-gradient(ellipse at 50% 40%, #542936, #251820 72%);
      color: #efced4;
      font: italic clamp(28px, 5vw, 50px)/1.1 Georgia, serif;
    }
    blockquote { margin: 30px auto 12px; font-size: clamp(21px, 4vw, 34px); }
    .details { color: #dec1c8; font-size: .85rem; }
    .about { border-top: 1px solid #f5e9e529; padding: 42px 0; }
    .about p, .page-copy p { max-width: 60ch; margin: 0 auto 1em; }
    .page-copy { padding: 22px 0 62px; }
    .page-copy h2 { font: 400 clamp(30px, 6vw, 54px)/1.2 Georgia, serif; text-transform: none; letter-spacing: 0; }
    .menu-bar {
      position: relative;
      z-index: 1;
      border-bottom: 1px solid #f5e9e529;
      color: #f5e9e5;
    }
    .menu-bar summary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .65em;
      min-height: 46px;
      cursor: pointer;
      list-style: none;
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .19em;
      text-transform: uppercase;
    }
    .menu-bar summary::-webkit-details-marker { display: none; }
    .menu-bar summary:focus-visible { outline: 2px solid #e8aeba; outline-offset: -4px; }
    .menu-bar summary::after { content: ""; width: .45em; height: .45em; border: solid currentColor; border-width: 0 1px 1px 0; transform: rotate(45deg); }
    .menu-bar[open] summary::after { transform: rotate(225deg); }
    .menu-bar .site-nav { padding: 8px 20px 18px; }
    .menu-bar .close-label { display: none; }
    body:has(.menu-bar[open]) { overflow: hidden; }
    .menu-bar[open] {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: auto;
      background: #141014;
    }
    .menu-bar[open] summary { border-bottom: 1px solid #f5e9e529; }
    .menu-bar[open] summary::after { content: "×"; width: auto; height: auto; border: 0; transform: none; font-size: 1.25rem; }
    .menu-bar[open] .open-label { display: none; }
    .menu-bar[open] .close-label { display: inline; }
    .menu-bar[open] .site-nav {
      align-self: center;
      display: grid;
      justify-items: center;
      gap: clamp(16px, 4vh, 42px);
      padding: 30px 20px 76px;
      font: 400 clamp(48px, 11vw, 112px)/1 Georgia, serif;
      letter-spacing: -.045em;
      text-transform: none;
    }
    .menu-bar .site-nav a { text-decoration: none; }
    .menu-bar .site-nav a[aria-current] { color: #e8aeba; }
    .site-nav a[aria-current] { text-decoration-thickness: 2px; }
    .socials a { display: grid; place-items: center; width: 44px; height: 44px; }
    .socials svg { width: 24px; height: 24px; }
    footer { border-top: 1px solid #f5e9e529; padding-block: 24px; }
    nav { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
    .contact-form { display: grid; gap: 18px; max-width: 510px; margin: 30px auto 24px; text-align: left; }
    .contact-form label { display: grid; gap: 6px; }
    .contact-form input, .contact-form textarea, .contact-form button {
      border: 1px solid #f5e9e55c;
      background: #1e171c;
      color: inherit;
      padding: 12px;
      font: inherit;
      border-radius: 0;
    }
    .contact-form textarea { resize: vertical; }
    .contact-form button { justify-self: start; opacity: .65; }
    .contact-form input:focus-visible, .contact-form textarea:focus-visible { outline: 2px solid #e8aeba; outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      a, .menu-bar summary {
        transition: color .22s ease, background-color .22s ease, text-underline-offset .22s ease;
      }
      .menu-bar summary::after, .menu-bar .site-nav a, .socials svg {
        transition: transform .24s ease;
      }
    }
    @media (hover: hover) {
      a:hover { text-underline-offset: .52em; }
      .menu-bar summary:hover { color: #e8aeba; background-color: #e8aeba10; }
      .menu-bar .site-nav a:hover { color: #e8aeba; }
      .socials a:hover { background-color: #e8aeba10; border-radius: 50%; }
    }
    @media (hover: hover) and (prefers-reduced-motion: no-preference) {
      .menu-bar .site-nav a:hover { transform: translateY(-4px) scale(1.04); }
      .socials a:hover svg { transform: translateY(-3px) scale(1.12); }
    }
    .artist-name {
      position: relative;
      display: inline-block;
      font-size: clamp(36px, 10.8vw, 156px);
      isolation: isolate;
    }
    .rose {
      position: absolute;
      width: 1.62em;
      height: auto;
      top: -.12em;
      opacity: 0;
      pointer-events: none;
      overflow: visible;
    }
    /* The tapered stems meet the opening and closing calligraphic swashes. */
    .rose-left { right: calc(100% - .22em); }
    .rose-right { left: calc(100% - .20em); top: -.07em; transform: scaleX(-1) rotate(-8deg); }
    .rose .stem { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .rose .bloom, .rose .foliage { opacity: 0; }
    .artist-name:hover .rose { opacity: 1; }
    .artist-name:hover .stem { stroke-dashoffset: 0; }
    .artist-name:hover .bloom, .artist-name:hover .foliage { opacity: 1; }
    @media (prefers-reduced-motion: no-preference) {
      .rose { transition: opacity .35s ease; }
      .rose .stem { transition: stroke-dashoffset 1.1s cubic-bezier(.22,.61,.36,1); }
      .rose .bloom, .rose .foliage { transition: opacity .55s ease; }
      .artist-name:hover .foliage { transition-delay: .25s; }
      .artist-name:hover .bloom { transition-delay: .55s; }
    }
    @media (hover: none) {
      .artist-name .rose, .artist-name .bloom, .artist-name .foliage { opacity: 1; }
      .artist-name .stem { stroke-dashoffset: 0; }
    }
    @media (max-width: 660px) {
      .artist-name { font-size: clamp(30px, 10.4vw, 69px); }
    }
  </style>

    <p>For bookings, press and other enquiries.</p>

<script>
  const menu = document.querySelector(".menu-bar");
  const pageContent = document.querySelectorAll("body > header, body > main, body > footer");
  menu.addEventListener("toggle", () => {
    for (const section of pageContent) section.inert = menu.open;
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && menu.open) {
      menu.open = false;
      menu.querySelector("summary").focus();
    }
  });
